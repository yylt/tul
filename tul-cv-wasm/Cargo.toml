[package]
name = "tul-cv-wasm"
version = "0.1.0"
edition = "2021"
description = "Client-side WASM tools for /tul_cv (image/text/unit conversion)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Version is inherited from the workspace, which resolves it once for the
# worker and both cv modules (see the root Cargo.toml).
wasm-bindgen = { workspace = true }

# image: only png/jpeg/webp codecs, no default features
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

# fonts + raster text rendering for watermark / text-to-image / PDF pages
font8x8 = "0.3.1"

# PDF generation (pure Rust)
pdf-writer = "0.15.0"

# text
# pulldown-cmark without getopts (the CLI feature is only for the binary)
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
base64 = "0.23.1"
serde_json = "1"
