[package]
name = "tul-cv-office-wasm"
version = "0.1.0"
edition = "2021"
description = "Office WASM module for /tul_cv (xlsx → csv/json, text → docx)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.127"
csv = "1.4.0"
serde_json = "1"

# office
calamine = "0.36.1"
# docx-rs without the "wasm" feature (we call it from our own wasm); the
# optional image dependency stays off, keeping the binary lean
docx-rs = { version = "0.4.22", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 2

[dev-dependencies]
