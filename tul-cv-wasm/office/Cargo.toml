[package]
name = "tul-cv-office-wasm"
version = "0.1.0"
edition = "2021"
description = "Office WASM module for /tul_cv (xlsx → csv/json, text → docx)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Version is inherited from the workspace, which resolves it once for the
# worker and both cv modules (see the root Cargo.toml).
wasm-bindgen = { workspace = true }
csv = "1.4.0"
serde_json = "1"

# office
calamine = "0.36.1"
# docx-rs without the "wasm" feature (we call it from our own wasm); the
# optional image dependency stays off, keeping the binary lean
docx-rs = { version = "0.4.22", default-features = false }
