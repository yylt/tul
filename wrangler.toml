name = "tul"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-10"

# TUL_CV_FEATURES enables the tul_cv feature (set to "tul_cv"); empty by default.
# Run `make cv-wasm` first to generate the embedded WASM assets when enabled.
[build]
command = "scripts/build-worker.sh --release --no-panic-recovery"
