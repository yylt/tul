<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">Accelerator</title>
<style>
<!-- NORMAL_CSS -->
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.topbar .lang-btn { font-size: .8rem; }
</style>
</head>
<body>
<div class="card">
<div class="topbar">
<span></span>
<button class="btn lang-btn" id="lang">中文</button>
</div>
<p class="desc" data-i18n="desc">Enter a URL to accelerate web access or download files. <code>https://</code> can be omitted.</p>
<form onsubmit="return go(event)" class="form-row">
<input id="url" type="text" data-i18n-ph="ph" placeholder="example.com/file.zip" autofocus>
<button class="btn" data-i18n="go">Go</button>
</form>
<p class="back"><a href="/" data-i18n="back">&larr; Back to Home</a></p>
</div>
<script>
const I18N = {
  zh: { title: '加速下载', desc: '输入 URL 加速访问网页或下载文件。<code>https://</code> 可省略。', ph: 'example.com/file.zip', go: '前往', back: '← 返回首页' },
  en: { title: 'Accelerator', desc: 'Enter a URL to accelerate web access or download files. <code>https://</code> can be omitted.', ph: 'example.com/file.zip', go: 'Go', back: '← Back to Home' }
};
let lang = localStorage.getItem('lang') || ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
function apply() {
  const t = I18N[lang] || I18N.en;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.dataset.i18nPh]; });
  document.getElementById('lang').textContent = lang === 'zh' ? 'EN' : '中文';
}
document.getElementById('lang').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('lang', lang); apply(); });
apply();
function go(e) { e.preventDefault(); var v = document.getElementById('url').value.trim(); if (v) location.href = '/' + v; return false; }
</script>
</body>
</html>
