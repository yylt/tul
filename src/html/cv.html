<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Tools</title>
<style>
<!-- NORMAL_CSS -->
body { align-items: flex-start; justify-content: center; padding-top: 40px; }
.container { max-width: 720px; width: 100%; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.topbar h1 { font-size: 1.05rem; color: #333; font-weight: 500; margin: 0; }
.search-row { display: flex; gap: 8px; margin-bottom: 16px; }
.search-row input { flex: 1; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { border: 1px solid #e5e5e5; border-radius: 999px; background: #fff; color: #666; font-family: inherit; font-size: .84rem; padding: 6px 18px; cursor: pointer; transition: all .15s; }
.tab:hover { border-color: #aaa; color: #333; }
.tab.active { background: #333; border-color: #333; color: #fff; }

/* flat list layout */
.tool-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
.tool-item { border: 1px solid #e8e8e8; border-radius: 10px; background: #fff; overflow: hidden; transition: border-color .15s; }
.tool-item:hover { border-color: #bbb; }
.tool-head { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; background: none; border: none; cursor: pointer; text-align: left; font-family: inherit; }
.tool-head:hover { background: #f7f7f7; }
.tool-item.open .tool-head { background: #f5f5f5; }
.tool-head .icon { font-size: 1.2rem; width: 28px; text-align: center; flex-shrink: 0; }
.tool-meta { flex: 1; min-width: 0; }
.tool-meta .name { display: block; font-size: .9rem; color: #222; font-weight: 500; }
.tool-meta .desc { display: block; font-size: .78rem; color: #999; margin-top: 2px; }
.chev { color: #bbb; font-size: .8rem; transition: transform .18s; flex-shrink: 0; }
.tool-item.open .chev { transform: rotate(90deg); color: #666; }
.tool-body { border-top: 1px solid #eee; padding: 18px; display: none; }
.tool-item.open .tool-body { display: block; }
.empty { text-align: center; color: #aaa; font-size: .88rem; padding: 40px 0; }

/* tool panel form */
.panel h2 { font-size: .95rem; color: #222; font-weight: 500; margin: 0 0 4px; }
.panel .sub { font-size: .8rem; color: #999; margin: 0 0 16px; }
.panel .field { margin-bottom: 14px; }
.panel label { display: block; font-size: .82rem; color: #666; margin-bottom: 6px; }
.panel textarea { width: 100%; border: 1px solid #e5e5e5; border-radius: 6px; font-family: inherit; font-size: .85rem; padding: 10px 12px; outline: none; min-height: 130px; resize: vertical; background: #fcfcfc; }
.panel textarea:focus { border-color: #999; background: #fff; }
.panel input[type=text], .panel input[type=number], .panel select { border: 1px solid #e5e5e5; border-radius: 6px; font-family: inherit; font-size: .85rem; padding: 8px 10px; outline: none; background: #fff; }
.panel input:focus, .panel select:focus { border-color: #999; }
.panel .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel .row label { margin-bottom: 0; }
.dropzone { border: 2px dashed #ddd; border-radius: 8px; padding: 22px; text-align: center; color: #999; font-size: .85rem; cursor: pointer; transition: border-color .15s, background .15s; }
.dropzone:hover, .dropzone.over { border-color: #999; background: #f7f7f7; }
.dropzone .fname { color: #333; margin-top: 8px; word-break: break-all; }

.result { margin-top: 14px; }
.result .lbl { font-size: .78rem; color: #999; display: block; margin: 14px 0 4px; }
.result .preview { max-width: 100%; max-height: 280px; border: 1px solid #eee; border-radius: 6px; display: block; margin: 0 0 8px; }
.result .meta { font-size: .8rem; color: #888; margin-bottom: 10px; }
.result .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.result .out { width: 100%; min-height: 150px; }
.err { color: #c33; font-size: .85rem; margin-top: 10px; }
.back { text-align: center; font-size: .82rem; margin: 28px 0 40px; }
</style>
</head>

// ---- list (accordion) ------------------------------------------------------

let activeTab = 'all';
let query = '';
let current = null;

const catText = c => t('tab_' + c);
const toolName = x => t('t_' + x.id);
const toolDesc = x => t('d_' + x.id);

function matches(x) {
  const q = query.toLowerCase();
  if (!q) return true;
  const hay = (toolName(x) + ' ' + toolDesc(x) + ' ' + catText(x.cat) +
    t('t_' + x.id) + ' ' + t('d_' + x.id) + ' ' + t('tab_' + x.cat)).toLowerCase();
  return hay.includes(q);
}

function renderList() {
  const list = document.getElementById('list');
  const items = TOOLS.filter(x => (activeTab === 'all' || x.cat === activeTab) && matches(x));
  if (!items.length) {
    list.innerHTML = '<div class="empty" data-i18n="empty">no matching tools</div>';
    applyLang();
    return;
  }
  list.innerHTML = items.map(x =>
    '<div class="tool-item" data-id="' + x.id + '">' +
    '<button class="tool-head" type="button">' +
    '<span class="icon">' + x.icon + '</span>' +
    '<span class="tool-meta">' +
    '<span class="name" data-i18n="t_' + x.id + '">' + toolName(x) + '</span>' +
    '<span class="desc" data-i18n="d_' + x.id + '">' + toolDesc(x) + '</span>' +
    '</span><span class="chev">\u25B8</span></button>' +
    '<div class="tool-body"></div></div>').join('');
  list.querySelectorAll('.tool-head').forEach(h => h.onclick = () => toggleItem(h.parentElement));
  applyLang();
}

function toggleItem(item) {
  const wasOpen = item.classList.contains('open');
  document.querySelectorAll('.tool-item.open').forEach(i => {
    i.classList.remove('open');
    i.querySelector('.tool-body').innerHTML = '';
  });
  if (!wasOpen) {
    item.classList.add('open');
    const x = TOOLS.find(y => y.id === item.dataset.id);
    if (x) renderPanel(item.querySelector('.tool-body'), x);
  }
}

document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim(); renderList(); });
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab'); if (!btn) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === btn));
  activeTab = btn.dataset.tab; renderList();
});
document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', lang);
  applyLang();
});

// ---- panel plumbing --------------------------------------------------------

function renderPanel(el, x) {
  current = x;
  const builders = { img_png_jpeg: panelConvert, img_jpeg_png: panelConvert, img_png_webp: panelConvert,
    img_jpeg_webp: panelConvert, img_webp_png: panelConvert, img_webp_jpeg: panelConvert,
    img_resize: panelResize, img_crop: panelCrop, img_watermark: panelWatermark, img_text2img: panelTextImage,
    txt_pdf: panelTextOut, txt_docx: panelTextOut, txt_encode: panelEncode, txt_json: panelJson,
    txt_md: panelMd, txt_lines: panelLines, txt_csv_json: panelCsvJson, txt_xlsx: panelXlsx,
    unit_conv: panelUnit };
  el.innerHTML = (builders[x.id] || panelFallback)(x);
  bindPanel(x, el);
  applyLang();
}

function panelFallback(x) {
  return '<h2 data-i18n="t_' + x.id + '">' + toolName(x) + '</h2><p class="sub" data-i18n="d_' + x.id + '">' + toolDesc(x) + '</p>';
}

function fileInput(accept) {
  return '<div class="dropzone" id="dz">' +
    '<div data-i18n="drop">drop a file here or click to select</div>' +
    '<input type="file" id="file" accept="' + accept + '" hidden>' +
    '<div class="fname" id="fname"></div></div>';
}

function bindDropzone(el, accept, onFile) {
  const dz = el.querySelector('#dz');
  const input = el.querySelector('#file');
  if (accept) input.accept = accept;
  const show = () => {
    const f = input.files[0];
    el.querySelector('#fname').textContent = f ? f.name : '';
  };
  dz.onclick = () => input.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => {
    e.preventDefault(); dz.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f && (!accept || f.type.startsWith('image/'))) { input.files = e.dataTransfer.files; show(); onFile(f); }
  };
  input.onchange = () => { show(); onFile(input.files[0]); };
}

function resultWrap() {
  return '<div class="orig-wrap" hidden><span class="lbl" data-i18n="original">Original</span>' +
    '<img class="preview orig-preview" alt=""><div class="meta orig-name"></div></div>' +
    '<div class="res-wrap" hidden><span class="lbl" data-i18n="result">Result</span>' +
    '<img class="preview" id="res-preview" alt=""><div class="meta" id="res-meta"></div>' +
    '<div class="actions"><button class="btn" id="dl" data-i18n="download">Download</button></div></div>';
}

function outMeta(bytes, name) {
  return '<div class="meta">' + name + ' &mdash; ' + (bytes.length / 1024).toFixed(1) + ' KB</div>';
}

function download(bytes, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes]));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function run(fn) {
  const el = current ? document.querySelector('.tool-item[data-id="' + current.id + '"] .tool-body') : null;
  const res = (el && el.querySelector('.result')) || document.getElementById('list');
  res.querySelectorAll('.err').forEach(x => x.remove());
  return Promise.resolve(ready).then(fn).catch(e => {
    res.insertAdjacentHTML('beforeend', '<p class="err">' + e + '</p>');
    throw e;
  });
}

function outName(orig, ext) {
  const base = (orig || 'output').replace(/\.[^.]+$/, '');
  return base + '.' + ext;
}

function intVal(el, sel, dflt) {
  const v = parseInt((el.querySelector(sel) || {}).value, 10);
  return Number.isFinite(v) ? v : dflt;
}

// ---- image panels ---------------------------------------------------------

// ---- panel behavior -------------------------------------------------------

function showOriginal(el, f) {
  const wrap = el.querySelector('.orig-wrap');
  if (!wrap) return;
  wrap.hidden = false;
  wrap.querySelector('.orig-preview').src = URL.createObjectURL(f);
  wrap.querySelector('.orig-name').textContent = f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)';
}

function showResult(el, bytes, fname) {
  const res = el.querySelector('.res-wrap');
  res.hidden = false;
  res.querySelector('#res-preview').src = URL.createObjectURL(new Blob([bytes]));
  res.querySelector('#res-meta').textContent = fname + ' — ' + (bytes.length / 1024).toFixed(1) + ' KB';
  res.querySelector('#dl').onclick = () => download(bytes, fname);
}

/// Live image tool: auto-process on file select and on parameter change
/// (debounced). `spec.noFile` tools (e.g. text→PNG) run without a file.
function bindLiveImage(el, spec) {
  const box = { f: null };
  let timer = null;

  const schedule = () => {
    if (!spec.noFile && !box.f) return;
    clearTimeout(timer);
    timer = setTimeout(processNow, 250);
  };

  const processNow = () => run(async () => {
    const p = spec.read();
    let u8 = null;
    if (!spec.noFile) {
      if (!box.f) return;
      u8 = new Uint8Array(await box.f.arrayBuffer());
    }
    const out = spec.compute(u8, p);
    showResult(el, out, spec.fname(box.f, p));
  });

  if (!spec.noFile) {
    bindDropzone(el, spec.accept || 'image/*', f => {
      box.f = f;
      showOriginal(el, f);
      schedule();
    });
  }
  (spec.live || []).forEach(sel => {
    const input = el.querySelector(sel);
    if (input) {
      input.addEventListener('input', schedule);
      input.addEventListener('change', schedule);
    }
  });
}

function bindPanel(x, el) {
  switch (x.id) {
    case 'img_png_jpeg':
      bindLiveImage(el, {
        accept: 'image/*',
        live: ['#quality'],
        read: () => ({ quality: intVal(el, '#quality', 85) }),
        compute: (u8, p) => convert_to_jpeg(u8, p.quality),
        fname: (f, p) => outName(f ? f.name : 'image', 'jpg'),
      });
      break;
    case 'img_jpeg_png':
      bindLiveImage(el, {
        accept: 'image/*',
        live: [],
        read: () => ({}),
        compute: (u8) => convert_to_png(u8),
        fname: (f) => outName(f ? f.name : 'image', 'png'),
      });
      break;
    case 'img_png_webp':
      bindLiveImage(el, {
        accept: 'image/*',
        live: [],
        read: () => ({}),
        compute: (u8) => convert_to_webp(u8, 80),
        fname: (f) => outName(f ? f.name : 'image', 'webp'),
      });
      break;
    case 'img_jpeg_webp':
      bindLiveImage(el, {
        accept: 'image/*',
        live: [],
        read: () => ({}),
        compute: (u8) => convert_to_webp(u8, 80),
        fname: (f) => outName(f ? f.name : 'image', 'webp'),
      });
      break;
    case 'img_webp_png':
      bindLiveImage(el, {
        accept: 'image/*',
        live: [],
        read: () => ({}),
        compute: (u8) => convert_to_png(u8),
        fname: (f) => outName(f ? f.name : 'image', 'png'),
      });
      break;
    case 'img_webp_jpeg':
      bindLiveImage(el, {
        accept: 'image/*',
        live: ['#quality'],
        read: () => ({ quality: intVal(el, '#quality', 85) }),
        compute: (u8, p) => convert_to_jpeg(u8, p.quality),
        fname: (f) => outName(f ? f.name : 'image', 'jpg'),
      });
      break;
    case 'img_resize':
      bindLiveImage(el, {
        accept: 'image/*',
        live: ['#size', '#ratio', '#fmt'],
        read: () => ({
          size: intVal(el, '#size', 1024),
          ratio: el.querySelector('#ratio').checked,
          fmt: el.querySelector('#fmt').value,
        }),
        compute: (u8, p) => resize_image(u8, p.size, p.ratio, p.fmt),
        fname: (f, p) => outName(f ? f.name : 'image', p.fmt),
      });
      break;
    case 'img_crop':
      bindLiveImage(el, {
        accept: 'image/*',
        live: ['#x', '#y', '#w', '#h', '#fmt'],
        read: () => ({
          x: intVal(el, '#x', 0), y: intVal(el, '#y', 0),
          w: Math.max(1, intVal(el, '#w', 100)), h: Math.max(1, intVal(el, '#h', 100)),
          fmt: el.querySelector('#fmt').value,
        }),
        compute: (u8, p) => crop_image(u8, p.x, p.y, p.w, p.h, p.fmt),
        fname: (f, p) => outName(f ? f.name : 'image', p.fmt),
      });
      break;
    case 'img_watermark':
      bindLiveImage(el, {
        accept: 'image/*',
        live: ['#wtext', '#alpha', '#fmt'],
        read: () => ({
          text: el.querySelector('#wtext').value || 'TUL',
          alpha: intVal(el, '#alpha', 96),
          fmt: el.querySelector('#fmt').value,
        }),
        compute: (u8, p) => add_text_watermark(u8, p.text, p.alpha, p.fmt),
        fname: (f, p) => outName(f ? f.name : 'image', p.fmt),
      });
      break;
    case 'img_text2img':
      // pure text rendering — no file needed; live preview on input
      bindLiveImage(el, {
        noFile: true,
        live: ['#ttext', '#tscale'],
        read: () => ({
          text: el.querySelector('#ttext').value || 'TUL',
          scale: Math.max(1, intVal(el, '#tscale', 4)),
        }),
        compute: (_u8, p) => text_to_image(p.text, p.scale),
        fname: () => 'text.png',
      });
      break;
    case 'txt_pdf': case 'txt_docx': {
      const btn = el.querySelector('#go');
      btn.onclick = () => run(async () => {
        const text = el.querySelector('#src').value;
        const out = x.id === 'txt_pdf'
          ? text_to_pdf(text, el.querySelector('#title').value || '')
          : (await loadOffice()).text_to_docx(text);
        const ext = x.id === 'txt_pdf' ? 'pdf' : 'docx';
        const r = el.querySelector('.result');
        r.innerHTML = outMeta(out, 'document.' + ext) + '<div class="actions"><button class="btn" id="dl" data-i18n="download">Download</button></div>';
        applyLang();
        r.querySelector('#dl').onclick = () => download(out, 'document.' + ext);
      });
      break;
    }
    case 'txt_encode': {
      const go = el.querySelector('#go');
      const op = el.querySelector('#op');
      const out = el.querySelector('#out');
      go.onclick = () => run(() => {
        const src = el.querySelector('#src').value;
        const enc = new TextEncoder(), dec = new TextDecoder();
        switch (op.value) {
          case 'b64e': out.value = to_base64(enc.encode(src)); break;
          case 'b64d': out.value = dec.decode(from_base64(src)); break;
          case 'hexe': out.value = to_hex(enc.encode(src)); break;
          case 'hexd': out.value = dec.decode(from_hex(src)); break;
          case 'gbke': out.value = to_hex(utf8_to_gbk(src)); break;
          case 'gbkd': out.value = gbk_to_utf8(from_hex(src)); break;
        }
      });
      break;
    }
    case 'txt_json': {
      el.querySelector('#fmt').onclick = () => run(() => el.querySelector('#out').value = json_format(el.querySelector('#src').value));
      el.querySelector('#min').onclick = () => run(() => el.querySelector('#out').value = json_minify(el.querySelector('#src').value));
      break;
    }
    case 'txt_md': {
      el.querySelector('#go').onclick = () => run(() => el.querySelector('#out').value = markdown_to_html(el.querySelector('#src').value));
      break;
    }
    case 'txt_lines': {
      el.querySelector('#go').onclick = () => run(() => {
        let s = el.querySelector('#src').value;
        if (el.querySelector('#dedupe').checked) s = dedupe_lines(s);
        if (el.querySelector('#numeric').checked || el.querySelector('#desc').checked) {
          s = sort_lines(s, el.querySelector('#numeric').checked, el.querySelector('#desc').checked);
        }
        el.querySelector('#out').value = s;
      });
      break;
    }
    case 'txt_csv_json': {
      el.querySelector('#go').onclick = () => run(() => {
        const d = el.querySelector('#delim').value;
        el.querySelector('#out').value = csv_to_json(el.querySelector('#src').value, d);
      });
      break;
    }
    case 'txt_xlsx': {
      const box = { f: null };
      const doConv = async (asJson) => {
        if (!box.f) return;
        const buf = await box.f.arrayBuffer();
        const sheet = el.querySelector('#sheet').value || '';
        const api = await loadOffice();
        el.querySelector('#out').value = asJson
          ? api.xlsx_to_json(new Uint8Array(buf), sheet)
          : api.xlsx_to_csv(new Uint8Array(buf), sheet);
      };
      bindDropzone(el, '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', f => { box.f = f; doConv(false); });
      el.querySelector('#csv').onclick = () => run(() => doConv(false));
      el.querySelector('#json').onclick = () => run(() => doConv(true));
      break;
    }
    case 'unit_conv': {
      const cat = el.querySelector('#cat'), from = el.querySelector('#from'), to = el.querySelector('#to');
      const fill = () => {
        const units = UNITS[cat.value];
        from.innerHTML = units.map(([l, v]) => '<option value="' + v + '">' + l + '</option>').join('');
        to.innerHTML = units.map(([l, v]) => '<option value="' + v + '">' + l + '</option>').join('');
        to.value = units[1] ? units[1][1] : units[0][1];
        applyLang();
      };
      const update = () => run(() => {
        const r = convert_unit(cat.value, parseFloat(el.querySelector('#val').value), from.value, to.value);
        el.querySelector('#out').value = isNaN(r) ? t('invalid') : String(r);
      });
      cat.onchange = () => { fill(); update(); };
      ['#from', '#to', '#val'].forEach(s => {
        const input = el.querySelector(s);
        input.addEventListener('input', update);
        input.addEventListener('change', update);
      });
      fill();
      update();
      break;
    }
  }
}
