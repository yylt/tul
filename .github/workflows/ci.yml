name: Test

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy
          target: wasm32-unknown-unknown
      - name: Run CI (fmt + clippy + tests, incl. tul-cv-wasm)
        run: make ci
      - name: Build worker (default features, no tul_cv)
        run: |
          cargo install -q worker-build
          chmod +x scripts/build-worker.sh
          scripts/build-worker.sh --dev
      - name: Build worker with tul_cv feature
        run: |
          cargo install -q wasm-bindgen-cli --version 0.2.127
          make cv-wasm
          TUL_CV_FEATURES=tul_cv scripts/build-worker.sh --dev
